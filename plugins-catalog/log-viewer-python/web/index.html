<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Przeglądarka logów</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<div class="app">
  <div class="toolbar" role="toolbar" aria-label="Widok logu">
    <label class="live" title="Dociąga nowe wpisy co 2 s">
      <input type="checkbox" id="live"><span class="switch" aria-hidden="true"></span><span>Śledzenie na żywo</span>
    </label>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
      <input id="filter" type="search" placeholder="Filtr" aria-label="Filtr wpisów" spellcheck="false">
      <span class="kbd">Ctrl+F</span>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Poziomy"></div>
    <div class="spacer"></div>
    <label class="check" title="Grupuj wpisy według żądań i źródeł"><input type="checkbox" id="group"> Grupuj</label>
    <button class="btn" id="export" type="button" title="Kopiuje widoczne wpisy do schowka">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v8M5 7l3 3 3-3M3 12.5h10"/></svg>
      Eksportuj
    </button>
  </div>
  <div class="body">
    <div class="table" id="table" tabindex="0" role="grid" aria-label="Wpisy logu">
      <div class="hdr" role="row">
        <span class="c-time" role="columnheader">Czas</span>
        <span class="c-level" role="columnheader">Poziom</span>
        <span class="c-source" role="columnheader">Źródło</span>
        <span class="c-msg" role="columnheader">Komunikat</span>
      </div>
      <div class="viewport" id="viewport">
        <div class="spacer-rows" id="spacerRows"></div>
        <div class="rows" id="rows"></div>
      </div>
      <div class="empty" id="empty" hidden></div>
    </div>
    <aside class="details" id="details" aria-label="Szczegóły wpisu">
      <div class="d-head"><span>Szczegóły wpisu</span><span class="kbd">Enter</span></div>
      <div class="d-body" id="detailBody"><p class="muted">Wybierz wpis strzałkami albo kliknięciem.</p></div>
    </aside>
  </div>
  <div class="status" id="status" role="status"></div>
</div>
<script src="viewer.js"></script>
</body>
</html>
