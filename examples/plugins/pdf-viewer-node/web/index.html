<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF</title>
  <link rel="stylesheet" href="pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="viewer.css">
  <script type="module" src="viewer.js"></script>
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <div class="group">
        <button id="previous" type="button" title="Poprzednia strona (PageUp)">▲</button>
        <button id="next" type="button" title="Następna strona (PageDown)">▼</button>
        <input id="pageNumber" type="number" min="1" value="1" title="Numer strony (Enter przechodzi)" aria-label="Numer strony">
        <span id="pageCount">/ –</span>
      </div>
      <div class="group">
        <button id="zoomOut" type="button" title="Pomniejsz">−</button>
        <select id="zoomSelect" title="Powiększenie" aria-label="Powiększenie">
          <option value="page-width">Szerokość strony</option>
          <option value="page-fit">Cała strona</option>
          <option value="auto">Automatycznie</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
          <option value="3">300%</option>
          <option id="customZoom" value="custom" hidden></option>
        </select>
        <button id="zoomIn" type="button" title="Powiększ">+</button>
      </div>
      <div class="group search">
        <input id="findInput" type="search" placeholder="Szukaj (Ctrl+F)" title="Enter: następne, Shift+Enter: poprzednie" aria-label="Szukaj w dokumencie">
        <button id="findPrevious" type="button" title="Poprzednie (Shift+Enter)">‹</button>
        <button id="findNext" type="button" title="Następne (Enter)">›</button>
        <span id="findCount"></span>
      </div>
      <div class="group end">
        <span id="status" role="status"></span>
        <button id="print" type="button" title="Drukuj">Drukuj</button>
      </div>
    </header>
    <main id="main">
      <div id="viewerContainer" tabindex="0">
        <div id="viewer" class="pdfViewer"></div>
      </div>
    </main>
  </div>
  <div id="printContainer"></div>
</body>
</html>
